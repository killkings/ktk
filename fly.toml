app = "ktk-authoritative-world-uriel29m"
primary_region = "gru"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ALLOWED_ORIGINS = "https://killkings.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
