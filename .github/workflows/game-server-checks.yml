name: KTK game server checks

on:
  pull_request:
    paths:
      - "server/**"
      - "online/**"
      - "js/online.js"
      - "campo_livre_atualizado.html"
      - "index.html"
      - "supabase/migrations/**"
      - ".github/workflows/game-server-checks.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned WebSocket dependency
        run: npm install --prefix server --ignore-scripts --no-audit --no-fund
      - name: Test authoritative simulation
        run: npm --prefix server test
      - name: Check server and browser module syntax
        run: |
          node --check server/index.mjs
          node --check server/world.mjs
          node --check server/supabase-store.mjs
          node --input-type=module --check < online/game-transport.js
          node --input-type=module --check < online/movement.js
          node --input-type=module --check < online/session.js
          node --input-type=module --check < online/player-sync.js
