name: Game module checks

on:
  pull_request:
    paths:
      - "campo_livre_atualizado.html"
      - "game/game-lifecycle.js"
      - "combat/**"
      - "js/online.js"
      - "online/**"
      - "equipment/catalog-sync.js"
      - "tools/test-entry-flow.mjs"
      - "tools/test-online-timeouts.mjs"
      - "tools/test-realtime-entry.mjs"
      - "mapa/fallback/**"
      - "mapa/mapa.js"
      - "mapa/player/stats*.js"
      - "render/world-renderer.js"
      - "online/movement.js"
      - "multiplayer/player-replica.js"
      - "js/game-state.js"
      - "tools/test-local-movement.mjs"
      - "tools/test-combat-flow.mjs"
      - "supabase/migrations/**"
      - "inventory/**"
      - "tools/test-wearable-separation.mjs"
      - "tools/test-inventory-interaction.mjs"
      - "input/input-controller.js"
      - "multiplayer/player-replica.js"
      - "js/game-state.js"
      - "tools/test-local-movement.mjs"
      - "tools/test-combat-flow.mjs"
      - ".github/workflows/game-module-checks.yml"
  push:
    branches: [main]
    paths:
      - "campo_livre_atualizado.html"
      - "game/game-lifecycle.js"
      - "combat/**"
      - "js/online.js"
      - "online/**"
      - "equipment/catalog-sync.js"
      - "tools/test-entry-flow.mjs"
      - "tools/test-online-timeouts.mjs"
      - "tools/test-realtime-entry.mjs"
      - "mapa/fallback/**"
      - "mapa/mapa.js"
      - "mapa/player/stats*.js"
      - "render/world-renderer.js"
      - "online/movement.js"
      - "multiplayer/player-replica.js"
      - "js/game-state.js"
      - "tools/test-local-movement.mjs"
      - "tools/test-combat-flow.mjs"
      - "supabase/migrations/**"
      - "inventory/**"
      - "tools/test-wearable-separation.mjs"
      - "input/input-controller.js"
      - "multiplayer/player-replica.js"
      - "js/game-state.js"
      - "tools/test-local-movement.mjs"
      - "tools/test-combat-flow.mjs"
      - ".github/workflows/game-module-checks.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check mapa/player/stats.js
          node --check mapa/player/stats-ui.js
          node --check mapa/fallback/grass-renderer.js
          node --check mapa/mapa.js
          node --check render/world-renderer.js
          node --check combat/combat-controller.js
          node --check input/input-controller.js
          node --check inventory/inventory-ui.js
          node --check inventory/inventory-state.js
          node --check multiplayer/player-replica.js
          node --check js/game-state.js
          node --input-type=module --check < online/movement.js
          node --input-type=module --check < online/actions.js
          node --check game/game-lifecycle.js
          node --input-type=module --check < js/online.js
          node --input-type=module --check < online/request-timeout.js
          node --input-type=module --check < online/session.js
          node --input-type=module --check < online/realtime.js
          node --input-type=module --check < online/player-sync.js
          node --input-type=module --check < equipment/catalog-sync.js
      - name: Check world-entry button flow
        run: node tools/test-entry-flow.mjs
      - name: Check online entry deadlines
        run: node tools/test-online-timeouts.mjs
      - name: Check Realtime entry and snapshot independence
        run: node tools/test-realtime-entry.mjs
      - name: Check immediate local movement prediction
        run: node tools/test-local-movement.mjs
      - name: Check combat and position synchronization
        run: node tools/test-combat-flow.mjs
      - name: Check wearable separation
        run: node tools/test-wearable-separation.mjs
      - name: Check inventory E drop and swap
        run: node tools/test-inventory-interaction.mjs
      - name: Check module boundaries and script order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const model = fs.readFileSync('mapa/player/stats.js', 'utf8');
          const ui = fs.readFileSync('mapa/player/stats-ui.js', 'utf8');
          const fallback = fs.readFileSync('mapa/fallback/grass-renderer.js', 'utf8');
          const controller = fs.readFileSync('render/world-renderer.js', 'utf8');
          const html = fs.readFileSync('campo_livre_atualizado.html', 'utf8');

          assert.doesNotMatch(model, /\bdocument\b|querySelector/);
          assert.match(model, /function subscribe\(/);
          assert.match(ui, /playerStats\.subscribe\(render\)/);
          assert.match(fallback, /function makeGrassTile\(/);
          assert.match(fallback, /window\.KTKGrassFallback\s*=\s*\{\s*draw/);
          assert.doesNotMatch(controller, /function hash2\(|function makeGrassTile\(|function drawGrass\(/);
          assert.match(controller, /window\.KTKGrassFallback/);

          assert.ok(html.indexOf('mapa/player/stats.js') < html.indexOf('mapa/player/stats-ui.js'));
          assert.ok(html.indexOf('mapa/fallback/grass-renderer.js') < html.indexOf('render/world-renderer.js'));
          console.log('Module boundaries and script order are valid.');
          NODE
