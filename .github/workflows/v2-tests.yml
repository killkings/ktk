name: V2 regression tests

on:
  push:
    branches:
      - main
      - "rebuild/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ktk_v2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ktk_v2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit and contract tests
        run: npm test
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase interfaces
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: ktk_v2_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f v2/tests/postgres-bootstrap.sql
      - name: Apply V2 migration to disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: ktk_v2_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117170000_ktk_v2_foundation.sql
      - name: Apply V2 gameplay migration to disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: ktk_v2_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117172000_ktk_v2_gameplay_actions.sql
      - name: Apply V2 server simulation migration to disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: ktk_v2_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117173000_ktk_v2_server_simulation.sql
      - name: Test server lifecycle, movement and crown
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: ktk_v2_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f v2/tests/server-integration.sql
